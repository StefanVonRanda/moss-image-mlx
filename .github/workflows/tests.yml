name: Tests

on: [push, pull_request]

jobs:
  test:
    runs-on: macos-14  # Apple Silicon; the tests force MLX's CPU device (no GPU in CI)
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv venv --python 3.12 && uv pip install -e ".[test]"
      - run: MOSS_MLX_TEST_CPU=1 uv run pytest -q
